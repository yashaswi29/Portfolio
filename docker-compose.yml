networks:
  portfolio_net:
    driver: bridge

services:
  frontend:
    container_name: frontend
    image: yashaswi29/portfolio-frontend:latest
    build:
      context: .
    ports:
      - "7002:5173"
    environment:
      - BACKEND_URL=http://backend:7001
    restart: unless-stopped
    networks:
      - portfolio_net

  backend:
    container_name: backend
    image: yashaswi29/portfolio-backend:latest
    build:
      context: ./backend
    ports:
      - "7001:7001"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/portfolio_db
      - REDIS_URL=redis://redis:6379/0
      # Contact-form email notifications (values come from the host env / .env;
      # nothing is committed). Leave unset to disable email (form still logs to file).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - CONTACT_NOTIFY_TO=${CONTACT_NOTIFY_TO:-}
      - CONTACT_NOTIFY_FROM=${CONTACT_NOTIFY_FROM:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_net

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=portfolio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - portfolio_net

volumes:
  postgres_data:
  redis_data:
  backend_data:
